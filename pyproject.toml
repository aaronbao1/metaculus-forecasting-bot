[project]
name = "metaculus-ensemble-bot"
version = "0.1.0"
description = "Calibrated ensemble scaffold bot for Metaculus FutureEval tournaments"
requires-python = ">=3.11"
dependencies = [
    "forecasting-tools>=0.2.40",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# TS submodel engines (backtest/submodels/engines.py); naive_drift needs none.
timeseries = ["statsforecast>=1.7"]
tsfm = ["chronos-forecasting>=1.4", "timesfm[torch]>=2.0"]

[tool.setuptools.packages.find]
include = ["bot*", "backtest*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
